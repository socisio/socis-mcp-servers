# Dependency scanning for the MCP servers SOCIS ships.
#
# Why this exists: cti-platform pinned @modelcontextprotocol/sdk at exactly
# 0.6.0, which carried GHSA-w48q-cv73-mx4w (high, DNS rebinding). `npm audit
# fix` could not resolve it without a major bump, so the bootstrap exited 1
# and the install failed outright — that is how we found it, on 2026-09-10,
# rather than from an advisory feed. One entry per manifest directory:
# Dependabot does not recurse, and a missing entry looks like coverage.
version: 2
updates:
  - package-ecosystem: npm
    directory: /servers/threat-intel
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies, threat-intel]
  - package-ecosystem: npm
    directory: /servers/ioc-reputation
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies, ioc-reputation]
  - package-ecosystem: npm
    directory: /servers/attack-surface
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies, attack-surface]
  - package-ecosystem: npm
    directory: /servers/cti-platform
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies, cti-platform]
  - package-ecosystem: npm
    directory: /servers/nvd
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies, nvd]
  - package-ecosystem: pip
    directory: /servers/n8n
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    labels: [dependencies, n8n]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    labels: [dependencies, ci]
